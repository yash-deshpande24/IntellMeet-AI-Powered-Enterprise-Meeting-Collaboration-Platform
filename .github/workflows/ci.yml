name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel an older run of the same branch when a new commit arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 1) Backend: install, syntax check, AI test, start server, health check
  # ---------------------------------------------------------------
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check every source file
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: AI summary accuracy test
        run: |
          if [ -f tests/summaryAccuracy.js ]; then
            node tests/summaryAccuracy.js
          else
            echo "No tests/summaryAccuracy.js found, skipping"
          fi

      - name: Start the API and check /api/health
        env:
          PORT: 5000
          NODE_ENV: development
          MONGODB_URI: mongodb://localhost:27017/intellmeet
          JWT_SECRET: ci-only-test-secret
          ALLOWED_ORIGINS: http://localhost:5173
        run: |
          node src/server.js &
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/api/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          exit 1

  # ---------------------------------------------------------------
  # 2) Frontend: install, lint, production build
  # ---------------------------------------------------------------
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint (warnings do not block the build)
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------
  # 3) Helm chart: lint and render
  # ---------------------------------------------------------------
  helm:
    name: Helm chart check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint K8s/helm/intellmeet

      - name: Render chart
        run: helm template intellmeet K8s/helm/intellmeet --namespace intellmeet > /dev/null

  # ---------------------------------------------------------------
  # 4) Docker: build both images. On main, also publish them to GHCR.
  # ---------------------------------------------------------------
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend, helm]
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and publish) backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:latest
            ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}

      - name: Build (and publish) frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: ${{ env.PUBLISH == 'true' }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:5000/api' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}