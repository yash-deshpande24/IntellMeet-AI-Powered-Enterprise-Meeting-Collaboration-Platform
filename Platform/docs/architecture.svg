<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">IntellMeet Architecture</text>

  <rect x="260" y="60" width="380" height="80" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="450" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#3730a3">Browser: React + Vite SPA</text>
  <text x="450" y="112" text-anchor="middle" font-size="12" fill="#475569">Tailwind UI | Axios | Socket.io client | Web Speech API</text>

  <line x1="360" y1="140" x2="360" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="540" y1="195" x2="540" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="350" y="172" text-anchor="end" font-size="12" fill="#475569">REST + JWT</text>
  <text x="550" y="172" font-size="12" fill="#475569">WebSocket</text>

  <rect x="60" y="195" width="780" height="170" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="450" y="220" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Backend: Node.js + Express</text>
  <rect x="80" y="235" width="740" height="30" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="450" y="255" text-anchor="middle" font-size="12" fill="#78350f">Middleware: JWT auth | rate limiter | Helmet | CORS | upload</text>
  <rect x="80" y="280" width="230" height="70" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="195" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Controllers</text>
  <text x="195" y="322" text-anchor="middle" font-size="11" fill="#166534">auth | meeting | task | workspace</text>
  <text x="195" y="338" text-anchor="middle" font-size="11" fill="#166534">notification | analytics</text>
  <rect x="335" y="280" width="230" height="70" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="450" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Services</text>
  <text x="450" y="322" text-anchor="middle" font-size="11" fill="#1d4ed8">aiService (summary, actions)</text>
  <text x="450" y="338" text-anchor="middle" font-size="11" fill="#1d4ed8">notificationService</text>
  <rect x="590" y="280" width="230" height="70" rx="6" fill="#fce7f3" stroke="#db2777"/>
  <text x="705" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#831843">Socket.io</text>
  <text x="705" y="322" text-anchor="middle" font-size="11" fill="#9d174d">rooms | chat | transcripts</text>
  <text x="705" y="338" text-anchor="middle" font-size="11" fill="#9d174d">signaling | notifications</text>

  <line x1="195" y1="365" x2="195" y2="425" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="450" y1="365" x2="450" y2="425" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <line x1="705" y1="365" x2="705" y2="425" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a)"/>

  <rect x="70" y="425" width="250" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="195" y="452" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">MongoDB</text>
  <text x="195" y="474" text-anchor="middle" font-size="11" fill="#047857">users | meetings | tasks</text>
  <text x="195" y="490" text-anchor="middle" font-size="11" fill="#047857">workspaces | notifications</text>
  <rect x="325" y="425" width="250" height="80" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="450" y="452" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">Cloudinary</text>
  <text x="450" y="474" text-anchor="middle" font-size="11" fill="#c2410c">avatar uploads</text>
  <text x="450" y="490" text-anchor="middle" font-size="11" fill="#c2410c">(Base64 fallback)</text>
  <rect x="580" y="425" width="250" height="80" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="705" y="452" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b21b6">OpenAI (optional)</text>
  <text x="705" y="474" text-anchor="middle" font-size="11" fill="#6d28d9">used only when</text>
  <text x="705" y="490" text-anchor="middle" font-size="11" fill="#6d28d9">OPENAI_API_KEY is set</text>

  <text x="450" y="540" text-anchor="middle" font-size="12" fill="#475569">Deploy: GitHub Actions -> Docker images -> Compose / Kubernetes / Helm / hosting</text>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>