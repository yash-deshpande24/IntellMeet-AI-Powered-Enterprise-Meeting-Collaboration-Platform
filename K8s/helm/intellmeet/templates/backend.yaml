apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: intellmeet
data:
  PORT: "5000"
  NODE_ENV: "development"          # development enables demo seed data
  MONGODB_URI: "mongodb://mongo:27017/intellmeet"
  ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: intellmeet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Your connectDB() does not retry, so wait until MongoDB accepts connections
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mongo 27017; do echo waiting for mongo; sleep 2; done"]
      containers:
        - name: backend
          image: intellmeet-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: intellmeet-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: intellmeet
spec:
  selector:
    app: backend
  sessionAffinity: ClientIP       # Socket.io needs the same client on the same pod
  ports:
    - port: 5000
      targetPort: 5000