global:
  scrape_interval: 15s

scrape_configs:
  # Backend running on your own PC (npm start / node server.js on port 5000)
  - job_name: intellmeet-local
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5000"]

  # Backend on Render. Remove this job if you do not want Prometheus to wake it up.
  # If you set METRICS_TOKEN on Render, uncomment the authorization block.
  - job_name: intellmeet-render
    scheme: https
    metrics_path: /metrics
    scrape_interval: 60s
    static_configs:
      - targets: ["intellmeet-api-new0.onrender.com"]
    # authorization:
    #   credentials: "PUT_YOUR_METRICS_TOKEN_HERE"